<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Actuator Health Monitor</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
        <rect width="32" height="32" rx="8" fill="#fcfcfb"/>
        <path d="M16 6v13" stroke="#0d366b" stroke-width="3" stroke-linecap="round"/>
        <path d="M16 12l6 5" stroke="#0d366b" stroke-width="2.5" stroke-linecap="round"/>
        <circle cx="16" cy="23" r="4" fill="none" stroke="#0d366b" stroke-width="3"/>
      </svg>
      <div>
        <h1>Nose Gear Actuator Health</h1>
        <p>B787 fleet · readiness and failure risk for the next 30 days</p>
      </div>
    </div>
    <div class="topbar-meta" id="meta"></div>
  </header>

  <main class="page">
    <section class="controls" aria-label="Filters">
      <div class="month-picker" id="months"></div>
      <div class="tiles" id="tiles"></div>
    </section>
    <div id="alert"></div>
    <section class="card" id="outlook" aria-label="Fleet outlook"></section>
    <div class="layout">
      <section class="card" id="fleet" aria-label="Fleet"></section>
      <aside class="card" id="detail" aria-label="Selected aircraft"></aside>
    </div>
  </main>

  <div id="tooltip" class="tooltip" role="tooltip" hidden></div>
  <script src="app.js"></script>
</body>
</html>
